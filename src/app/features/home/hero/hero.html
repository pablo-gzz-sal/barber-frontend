<section class="relative h-screen w-full bg-black flex items-center justify-center overflow-hidden">
  <!-- Gradient Overlay -->
  <div class="absolute inset-0 bg-gradient-to-b from-black via-black/80 to-black/90 z-10"></div>

  <!--
    Steph §4 gives the homepage H1 as "Hair in Motion. Beauty in Balance." — both lines.
    On screen that's split across a headline and a sub-headline, and again into desktop and
    mobile treatments, so four elements hold pieces of one sentence. Putting the heading
    here keeps the DOM at exactly one <h1> with exactly the spec's wording, instead of the
    two competing H1s (desktop + mobile, both rendered, one hidden by CSS) this had before.
    The visible type below is presentational and stays untouched by GSAP's character split.
  -->
  <h1 class="sr-only">Hair in Motion. Beauty in Balance.</h1>

  <!-- Content -->
  <div class="relative z-20 w-full px-8 md:px-4 md:text-center md:overflow-hidden" #heroText>
    <!-- Desktop versions -->
    <div
      aria-hidden="true"
      class="hidden lg:block hero-line font-thin text-white tracking-[0.1em] leading-tight md:whitespace-nowrap md:leading-none"
      style="font-size: clamp(2.8rem, 9.5vw, 14rem)"
    >
      {{ content.hero.line1 }}
    </div>
    <div
      aria-hidden="true"
      class="hidden lg:block hero-line font-thin text-white/40 tracking-[0.1em] leading-tight md:whitespace-nowrap md:leading-none mt-2 md:mt-0"
      style="font-size: clamp(2.4rem, 7.6vw, 10rem)"
    >
      {{ content.hero.line2 }}
    </div>

    <!-- Mobile versions -->
    <div
      aria-hidden="true"
      class="lg:hidden hero-line mobile-line font-thin text-white tracking-[0.1em] leading-tight"
      style="font-size: clamp(3.2rem, 13vw, 6rem)"
    >
      <span class="block">HAIR IN</span>
      <span class="block">MOTION</span>
    </div>

    <div
      aria-hidden="true"
      class="lg:hidden hero-line mobile-line font-thin text-white/40 tracking-[0.1em] leading-tight mt-2"
      style="font-size: clamp(2.8rem, 10.5vw, 5rem)"
    >
      <span class="block">BEAUTY IN</span>
      <span class="block">BALANCE</span>
    </div>

    <!-- Steph §4: the salon's location only appeared on /contact until now. -->
    <p
      class="mt-6 md:mt-8 text-[11px] md:text-xs font-light uppercase tracking-[0.28em] text-white/60"
    >
      Upper East Side, Manhattan &middot; New York City
    </p>
  </div>

  <!-- Bottom gradient fade -->
  <div
    class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-black to-transparent z-10"
  ></div>
</section>
