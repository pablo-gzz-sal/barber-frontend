<div class="animate-fade-in-up delay-300 uppercase">
  <div class="flex flex-col gap-3">
    @if (loading) {
      <div class="flex flex-wrap gap-1.5 sm:gap-2 uppercase">
        @for (i of [1, 2, 3, 4]; track i) {
          <div class="skeleton h-8 sm:h-9 w-20 sm:w-24 rounded"></div>
        }
      </div>
    } @else {
      <div class="flex flex-wrap gap-1.5 sm:gap-2">
        @for (c of categories; track c.key) {
          <button
            type="button"
            (click)="selectCategory(c.key)"
            class="overflow-hidden px-2 sm:px-2.5 uppercase py-1.5 leading-4 lowercase outline-offset-[-2px] outline-primary text-[10px] font-semibold tracking-[0.16em] transition-all duration-300 hover:bg-primary hover:text-white border border-black rounded-[5px]"
            [class.bg-primary]="selected === c.key"
            [class.text-white]="selected === c.key"
            [class.bg-transparent]="selected !== c.key"
            [class.text-text-primary]="selected !== c.key"
          >
            {{ c.label }}
          </button>
        }
      </div>
    }
  </div>
</div>
